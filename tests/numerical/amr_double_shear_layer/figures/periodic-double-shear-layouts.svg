<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1320" viewBox="0 0 1760 1320" role="img" aria-labelledby="title desc">
<title id="title">双剪切层的三种周期加密布局</title>
<desc id="desc">三列在同一物理坐标中比较L1上下拼接、L2接触上边界、L2跨越上边界。L1均为跨周期的粗层支撑带，下方保留对下剪切层的覆盖；每列下方展开周期接缝，依次得到L1对L1、L2对L1和L2对L2邻接。坐标和带宽为已确认目标，非实际网格或数值结果。</desc>
<defs>
 <pattern id="g0" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#a9b7c5" stroke-width=".8"/></pattern>
 <pattern id="g1" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M11 0H0V11" fill="none" stroke="#4b83b7" stroke-opacity=".38" stroke-width=".65"/></pattern>
 <pattern id="g2" width="5.5" height="5.5" patternUnits="userSpaceOnUse"><path d="M5.5 0H0V5.5" fill="none" stroke="#14826b" stroke-opacity=".28" stroke-width=".5"/></pattern>
 <marker id="period-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#855cb1"/></marker>
 <style>
 text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#203044}
 .title{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#526174}.heading{font-size:24px;font-weight:700}
 .body{font-size:18px}.small{font-size:16px;fill:#526174}.axis{font-size:15px;fill:#46566a}.tag{font-size:19px;font-weight:700}
 .seam{stroke:#855cb1;stroke-width:2.6;stroke-dasharray:7 5}.shear{stroke:#b33d5b;stroke-width:2;stroke-dasharray:9 6}
 </style>
</defs>
<rect width="1760" height="1320" fill="#f6f8fb"/>

<text x="42" y="51" class="title" >新增 DSL 周期布局：拼接、接触与跨越</text>
<text x="42" y="86" class="sub" >统一物理坐标：x/L、y/L ∈ [0,1]，上下周期连接。颜色表示最细有效层；目标区间已确认，实际 A 待核对。</text>
<text x="42" y="114" class="sub" >三个示例共用 L1 = [1/2,1] ∪ [0,3/8]；保留下剪切层的 L1 覆盖，逐列改变上方 L2 的位置。</text>
<rect x="32" y="140" width="552" height="1020" fill="white" rx="18" stroke="#d5dde7"/>
<text x="58" y="183" class="heading" >① L1 在周期缝拼接</text>
<text x="58" y="215" class="body" >上方 L2 带 + 下方 L1 带</text>
<text x="104" y="251" class="axis" >y/L</text>
<g id="DSL-P1-domain" transform="translate(104 270)">
<rect x="0" y="0" width="352" height="352" fill="#edf1f5" />
<rect x="0" y="0" width="352" height="352" fill="url(#g0)" />
<rect x="0" y="0" width="352" height="176.0" fill="#dcecff" data-level="1" data-lo="0.5" data-hi="1"/>
<rect x="0" y="0" width="352" height="176.0" fill="url(#g1)" />
<rect x="0" y="0" width="352" height="176.0" fill="none" stroke="#3a79b5" stroke-width="2.4"/>
<rect x="0" y="220.0" width="352" height="132.0" fill="#dcecff" data-level="1" data-lo="0" data-hi="0.375"/>
<rect x="0" y="220.0" width="352" height="132.0" fill="url(#g1)" />
<rect x="0" y="220.0" width="352" height="132.0" fill="none" stroke="#3a79b5" stroke-width="2.4"/>
<rect x="0" y="44.0" width="352" height="88.0" fill="#d4f1e7" data-level="2" data-lo="0.625" data-hi="0.875"/>
<rect x="0" y="44.0" width="352" height="88.0" fill="url(#g2)" />
<rect x="0" y="44.0" width="352" height="88.0" fill="none" stroke="#12866a" stroke-width="2.6"/>
<path d="M0 88H352M0 264H352" class="shear"/>
<rect x="0" y="0" width="352" height="352" fill="none" stroke="#34495e" stroke-width="1.8"/>
<path d="M0 0H352M0 352H352" class="seam"/>
<text x="-17" y="6" class="axis" text-anchor="end">1</text>
<text x="-17" y="94.0" class="axis" text-anchor="end">3/4</text>
<text x="-17" y="182.0" class="axis" text-anchor="end">1/2</text>
<text x="-17" y="270.0" class="axis" text-anchor="end">1/4</text>
<text x="-17" y="358" class="axis" text-anchor="end">0</text>
<text x="0" y="379" class="axis" text-anchor="middle">0</text>
<text x="352" y="379" class="axis" text-anchor="middle">1</text>
<text x="366" y="379" class="axis" >x/L</text>
<text x="176" y="204" class="small" text-anchor="middle">L0 间隔</text>
</g>
<path d="M463 270H486V622H463" fill="none" stroke="#855cb1" stroke-width="2" marker-start="url(#period-arrow)" marker-end="url(#period-arrow)"/>
<text x="493" y="408" class="small" >周期</text>
<text x="493" y="433" class="small" >拼接</text>
<text x="58" y="681" class="body" >L2：[5/8, 7/8]</text>
<text x="58" y="713" class="small" >L2 不接触周期缝。</text>
<text x="58" y="740" class="small" >上、下 L1 片通过 y=1≡0 直接连接。</text>
<text x="58" y="785" class="tag" >接缝展开：把下边界外接到上边界</text>
<g id="DSL-P1-seam" transform="translate(104 808)">
<rect x="0" y="0" width="352" height="78.0" fill="#dcecff" data-side="zero-plus" data-level="1"/>
<rect x="0" y="78.0" width="352" height="78.0" fill="#dcecff" data-side="one-minus" data-level="1"/>
<rect x="0" y="0" width="352" height="156" fill="none" stroke="#b8c6d5"/>
<path d="M0 78.0H352" class="seam"/>
<text x="176" y="42" class="tag" text-anchor="middle">下边界内侧 0⁺ · L1</text>
<text x="176" y="125" class="tag" text-anchor="middle">上边界内侧 1⁻ · L1</text>
<text x="-15" y="84.0" class="axis" text-anchor="end">1≡0</text>
</g>
<text x="308" y="1002" class="heading" text-anchor="middle">L1 ↔ L1 · 同层邻接</text>
<text x="58" y="1045" class="body" >基本域画成两片 L1；</text>
<text x="58" y="1074" class="body" >周期域中属于同一个连通区域。</text>
<text x="58" y="1127" class="small" >DSL-P1  ·  Re=10000  ·  u₀,lb=0.1  ·  BGK</text>
<rect x="604" y="140" width="552" height="1020" fill="white" rx="18" stroke="#d5dde7"/>
<text x="630" y="183" class="heading" >② L2 接触上边界</text>
<text x="630" y="215" class="body" >L2 终止于 y/L=1；L1 继续跨缝</text>
<text x="676" y="251" class="axis" >y/L</text>
<g id="DSL-P2-domain" transform="translate(676 270)">
<rect x="0" y="0" width="352" height="352" fill="#edf1f5" />
<rect x="0" y="0" width="352" height="352" fill="url(#g0)" />
<rect x="0" y="0" width="352" height="176.0" fill="#dcecff" data-level="1" data-lo="0.5" data-hi="1"/>
<rect x="0" y="0" width="352" height="176.0" fill="url(#g1)" />
<rect x="0" y="0" width="352" height="176.0" fill="none" stroke="#3a79b5" stroke-width="2.4"/>
<rect x="0" y="220.0" width="352" height="132.0" fill="#dcecff" data-level="1" data-lo="0" data-hi="0.375"/>
<rect x="0" y="220.0" width="352" height="132.0" fill="url(#g1)" />
<rect x="0" y="220.0" width="352" height="132.0" fill="none" stroke="#3a79b5" stroke-width="2.4"/>
<rect x="0" y="0" width="352" height="132.0" fill="#d4f1e7" data-level="2" data-lo="0.625" data-hi="1"/>
<rect x="0" y="0" width="352" height="132.0" fill="url(#g2)" />
<rect x="0" y="0" width="352" height="132.0" fill="none" stroke="#12866a" stroke-width="2.6"/>
<path d="M0 88H352M0 264H352" class="shear"/>
<rect x="0" y="0" width="352" height="352" fill="none" stroke="#34495e" stroke-width="1.8"/>
<path d="M0 0H352M0 352H352" class="seam"/>
<text x="-17" y="6" class="axis" text-anchor="end">1</text>
<text x="-17" y="94.0" class="axis" text-anchor="end">3/4</text>
<text x="-17" y="182.0" class="axis" text-anchor="end">1/2</text>
<text x="-17" y="270.0" class="axis" text-anchor="end">1/4</text>
<text x="-17" y="358" class="axis" text-anchor="end">0</text>
<text x="0" y="379" class="axis" text-anchor="middle">0</text>
<text x="352" y="379" class="axis" text-anchor="middle">1</text>
<text x="366" y="379" class="axis" >x/L</text>
<text x="176" y="204" class="small" text-anchor="middle">L0 间隔</text>
</g>
<path d="M1035 270H1058V622H1035" fill="none" stroke="#855cb1" stroke-width="2" marker-start="url(#period-arrow)" marker-end="url(#period-arrow)"/>
<text x="1065" y="408" class="small" >周期</text>
<text x="1065" y="433" class="small" >拼接</text>
<text x="630" y="681" class="body" >L2：[5/8, 1]</text>
<text x="630" y="713" class="small" >L2 在上边界处结束，没有下侧 L2。</text>
<text x="630" y="740" class="small" >周期缝因此是 L1/L2 粗细接口。</text>
<text x="630" y="785" class="tag" >接缝展开：把下边界外接到上边界</text>
<g id="DSL-P2-seam" transform="translate(676 808)">
<rect x="0" y="0" width="352" height="78.0" fill="#dcecff" data-side="zero-plus" data-level="1"/>
<rect x="0" y="78.0" width="352" height="78.0" fill="#d4f1e7" data-side="one-minus" data-level="2"/>
<rect x="0" y="0" width="352" height="156" fill="none" stroke="#b8c6d5"/>
<path d="M0 78.0H352" class="seam"/>
<text x="176" y="42" class="tag" text-anchor="middle">下边界内侧 0⁺ · L1</text>
<text x="176" y="125" class="tag" text-anchor="middle">上边界内侧 1⁻ · L2</text>
<text x="-15" y="84.0" class="axis" text-anchor="end">1≡0</text>
</g>
<text x="880" y="1002" class="heading" text-anchor="middle">L2 ↔ L1 · 粗细接口</text>
<text x="630" y="1045" class="body" >接触边界不等于自动跨越；</text>
<text x="630" y="1074" class="body" >L1 在缝另一侧提供粗层支撑。</text>
<text x="630" y="1127" class="small" >DSL-P2  ·  Re=10000  ·  u₀,lb=0.1  ·  BGK</text>
<rect x="1176" y="140" width="552" height="1020" fill="white" rx="18" stroke="#d5dde7"/>
<text x="1202" y="183" class="heading" >③ L2 跨过上边界</text>
<text x="1202" y="215" class="body" >L2 与 L1 均跨缝，粗层包络继续延伸</text>
<text x="1248" y="251" class="axis" >y/L</text>
<g id="DSL-P3-domain" transform="translate(1248 270)">
<rect x="0" y="0" width="352" height="352" fill="#edf1f5" />
<rect x="0" y="0" width="352" height="352" fill="url(#g0)" />
<rect x="0" y="0" width="352" height="176.0" fill="#dcecff" data-level="1" data-lo="0.5" data-hi="1"/>
<rect x="0" y="0" width="352" height="176.0" fill="url(#g1)" />
<rect x="0" y="0" width="352" height="176.0" fill="none" stroke="#3a79b5" stroke-width="2.4"/>
<rect x="0" y="220.0" width="352" height="132.0" fill="#dcecff" data-level="1" data-lo="0" data-hi="0.375"/>
<rect x="0" y="220.0" width="352" height="132.0" fill="url(#g1)" />
<rect x="0" y="220.0" width="352" height="132.0" fill="none" stroke="#3a79b5" stroke-width="2.4"/>
<rect x="0" y="0" width="352" height="132.0" fill="#d4f1e7" data-level="2" data-lo="0.625" data-hi="1"/>
<rect x="0" y="0" width="352" height="132.0" fill="url(#g2)" />
<rect x="0" y="0" width="352" height="132.0" fill="none" stroke="#12866a" stroke-width="2.6"/>
<rect x="0" y="308.0" width="352" height="44.0" fill="#d4f1e7" data-level="2" data-lo="0" data-hi="0.125"/>
<rect x="0" y="308.0" width="352" height="44.0" fill="url(#g2)" />
<rect x="0" y="308.0" width="352" height="44.0" fill="none" stroke="#12866a" stroke-width="2.6"/>
<path d="M0 88H352M0 264H352" class="shear"/>
<rect x="0" y="0" width="352" height="352" fill="none" stroke="#34495e" stroke-width="1.8"/>
<path d="M0 0H352M0 352H352" class="seam"/>
<text x="-17" y="6" class="axis" text-anchor="end">1</text>
<text x="-17" y="94.0" class="axis" text-anchor="end">3/4</text>
<text x="-17" y="182.0" class="axis" text-anchor="end">1/2</text>
<text x="-17" y="270.0" class="axis" text-anchor="end">1/4</text>
<text x="-17" y="358" class="axis" text-anchor="end">0</text>
<text x="0" y="379" class="axis" text-anchor="middle">0</text>
<text x="352" y="379" class="axis" text-anchor="middle">1</text>
<text x="366" y="379" class="axis" >x/L</text>
<text x="176" y="204" class="small" text-anchor="middle">L0 间隔</text>
</g>
<path d="M1607 270H1630V622H1607" fill="none" stroke="#855cb1" stroke-width="2" marker-start="url(#period-arrow)" marker-end="url(#period-arrow)"/>
<text x="1637" y="408" class="small" >周期</text>
<text x="1637" y="433" class="small" >拼接</text>
<text x="1202" y="681" class="body" >L2：[5/8, 1] ∪ [0, 1/8]</text>
<text x="1202" y="713" class="small" >跨缝 L2 可展开为 [5/8, 9/8]。</text>
<text x="1202" y="740" class="small" >L1 在 L2 两端外继续提供支撑。</text>
<text x="1202" y="785" class="tag" >接缝展开：把下边界外接到上边界</text>
<g id="DSL-P3-seam" transform="translate(1248 808)">
<rect x="0" y="0" width="352" height="78.0" fill="#d4f1e7" data-side="zero-plus" data-level="2"/>
<rect x="0" y="78.0" width="352" height="78.0" fill="#d4f1e7" data-side="one-minus" data-level="2"/>
<rect x="0" y="0" width="352" height="156" fill="none" stroke="#b8c6d5"/>
<path d="M0 78.0H352" class="seam"/>
<text x="176" y="42" class="tag" text-anchor="middle">下边界内侧 0⁺ · L2</text>
<text x="176" y="125" class="tag" text-anchor="middle">上边界内侧 1⁻ · L2</text>
<text x="-15" y="84.0" class="axis" text-anchor="end">1≡0</text>
</g>
<text x="1452" y="1002" class="heading" text-anchor="middle">L2 ↔ L2 · 同层邻接</text>
<text x="1202" y="1045" class="body" >上下 L2 片是同一带的两段；</text>
<text x="1202" y="1074" class="body" >缝处为同层邻接，粗细接口在带端。</text>
<text x="1202" y="1127" class="small" >DSL-P3  ·  Re=10000  ·  u₀,lb=0.1  ·  BGK</text>
<rect x="32" y="1180" width="1696" height="114" fill="#eaf0f7" rx="15"/>
<rect x="56" y="1200" width="22" height="18" fill="#edf1f5" stroke="#93a7bb"/>
<text x="90" y="1216" class="body" >L0</text>
<rect x="164" y="1200" width="22" height="18" fill="#dcecff" stroke="#93a7bb"/>
<text x="198" y="1216" class="body" >L1</text>
<rect x="272" y="1200" width="22" height="18" fill="#d4f1e7" stroke="#93a7bb"/>
<text x="306" y="1216" class="body" >L2</text>
<path d="M390 1209H430" class="shear"/>
<text x="442" y="1216" class="body" >初始剪切层：y/L=1/4、3/4</text>
<path d="M846 1209H886" class="seam"/>
<text x="898" y="1216" class="body" >周期缝：同一位置的两种表示</text>
<text x="56" y="1250" class="small" >xy 等效分辨率 128/256/512；准二维 z 格数 4/8/16、厚度 L/32。接缝展开图不是额外网格或 ghost 分配。</text>
<text x="56" y="1279" class="small" >L0 与被覆盖的 L1 存储仍保留，复合积分按最细有效层选取；实际覆盖、嵌套和通信需另行验证。格线稀疏示意。</text>
</svg>
